<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makine Kontrol Raporu</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8612c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kontrol Raporu">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --bg:#f3f4f6; --card:#ffffff; --text:#1d2330; --muted:#6b7280; --line:#d6d9e0; --accent:#e8612c; --ok:#15803d; --bad:#b91c1c; --na:#6b7280; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#15171c; --card:#1e2128; --text:#eceef2; --muted:#9aa1ad; --line:#353a45; } }
  :root[data-theme="dark"] { --bg:#15171c; --card:#1e2128; --text:#eceef2; --muted:#9aa1ad; --line:#353a45; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size:15px; }
  main { max-width:820px; margin:0 auto; padding:16px; box-sizing:border-box; }
  h1 { font-size:20px; margin:4px 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 10px; color:var(--accent); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width: 560px) { .grid { grid-template-columns:1fr; } .res label { min-width:0; } }
  label.f { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
  input[type=text], input[type=date], textarea, select {
    font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; width:100%;
  }
  textarea { min-height:80px; resize:vertical; }
  .item { border-top:1px solid var(--line); padding:12px 0; }
  .item:first-of-type { border-top:none; padding-top:0; }
  .item .name { font-weight:600; margin-bottom:8px; }
  .res { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .res label { flex:1; min-width:110px; display:flex; align-items:center; justify-content:center; gap:6px; padding:10px; border:1px solid var(--line); border-radius:8px; cursor:pointer; user-select:none; }
  .res input { accent-color:var(--accent); width:18px; height:18px; }
  .res label:has(input:checked) { border-color:var(--accent); background:rgba(232,97,44,.08); font-weight:600; }
  .radios { display:flex; gap:14px; flex-wrap:wrap; }
  .radios label { display:flex; align-items:center; gap:6px; }
  .btns { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0 30px; }
  button { font:inherit; border:none; border-radius:8px; padding:12px 18px; cursor:pointer; background:var(--accent); color:#fff; font-weight:600; }
  button.sec { background:transparent; color:var(--text); border:1px solid var(--line); }
  .photos { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; margin-top:10px; }
  .photos img { width:100%; border-radius:8px; border:1px solid var(--line); }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
  .msg { font-size:13px; color:var(--ok); min-height:18px; }

  /* ---- Rapor (yazdırılabilir) ---- */
  #report { display:none; background:#fff; color:#000; border:1px solid #999; padding:14px; border-radius:6px; }
  #report table { width:100%; border-collapse:collapse; font-size:13px; }
  #report td, #report th { border:1px solid #444; padding:6px 8px; vertical-align:top; }
  #report th { background:#f0f0f0; text-align:left; }
  #report .title { font-size:16px; font-weight:700; text-align:center; }
  #report .small { font-size:12px; text-align:center; }
  #report .ok { color:#15803d; font-weight:700; }
  #report .bad { color:#b91c1c; font-weight:700; }
  #report .na { color:#555; }
  #report .gallery { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #report .gallery img { width:100%; border:1px solid #bbb; }
  .sig td { text-align:center; }
  #report { position:relative; z-index:0; overflow:hidden; }
  .rwm { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:-1; opacity:.07; }
  .rwm img { width:85%; height:auto; opacity:.22; }
  .logo { display:block; height:36px; width:auto; max-width:100%; margin-bottom:6px; }

  @media print {
    body { background:#fff; }
    #editor, .noprint { display:none !important; }
    #report { display:block !important; border:none; padding:0; }
    @page { size:A4; margin:12mm; }
    #report table, #report .gallery { page-break-inside:auto; }
    #report tr { page-break-inside:avoid; }
  }
</style>
</head>
<body>
<main>

<!-- ============ DÜZENLEME EKRANI ============ -->
<div id="editor">
  <h1>Makine Kontrol Raporu</h1>
  <form id="form" autocomplete="off">

    <div class="card">
      <h2>Doküman</h2>
      <div class="grid">
        <label class="f">Doküman No<input type="text" name="docNo" value="KG-FR-20"></label>
        <label class="f">Revizyon No / Tarihi<input type="text" name="rev" value="4.20.2026"></label>
      </div>
    </div>

    <div class="card">
      <h2>Makine Bilgileri</h2>
      <div class="grid">
        <label class="f">Marka ve Model<input type="text" name="marka" value="ALFA LAVAL / ALDEC 95"></label>
        <label class="f">Makine Tipi<input type="text" name="tip" value="DEKANTÖR"></label>
        <label class="f">Seri Numarası<input type="text" name="seri" value="5025705-2014"></label>
        <label class="f">Servis Numarası<input type="text" name="servis" value="2609060026"></label>
        <label class="f">Müşteri<input type="text" name="musteri" value="MEY ALKOL"></label>
        <label class="f">Sektör<input type="text" name="sektor" value="ARITMA"></label>
      </div>
      <div style="margin-top:12px">
        <div class="f" style="font-size:13px;color:var(--muted);margin-bottom:6px">Test Adımı</div>
        <div class="radios">
          <label><input type="radio" name="test" value="sulu"> Sulu Test Kontrolü</label>
          <label><input type="radio" name="test" value="kuru" checked> Kuru Test Kontrolü</label>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Kontrol Maddeleri</h2>
      <div id="items"></div>
    </div>

    <div class="card">
      <h2>Sevk Kararı</h2>
      <label class="radios"><input type="checkbox" name="onay" checked> Sevk işlemleri hakkında onay kararı verilmiştir.</label>
      <label class="f" style="margin-top:10px">Ek açıklama<textarea name="sevkNot"></textarea></label>
    </div>

    <div class="card">
      <h2>İmza Bilgileri</h2>
      <div class="grid">
        <label class="f">Testi Raporlayan<input type="text" name="raporlayan" value="MEHMETBERK KÜRŞAD"></label>
        <label class="f">Testi Onaylayan<input type="text" name="onaylayan" value="MUHARREM ÖZKAN"></label>
        <label class="f">Tarih<input type="date" name="tarih" value="2026-09-29"></label>
      </div>
    </div>

    <div class="card">
      <h2>Görseller</h2>
      <input type="file" id="photoInput" accept="image/*" capture="environment" multiple>
      <div class="hint">Fotoğraflar sadece bu oturumda tutulur. Raporu kaydetmeden sayfayı kapatmayın.</div>
      <div class="photos" id="photos"></div>
    </div>

    <div class="btns noprint">
      <button type="button" class="sec" id="saveDraft">Taslağı Kaydet</button>
      <button type="button" class="sec" id="clearDraft">Taslağı Temizle</button>
      <button type="button" id="preview">Raporu Önizle</button>
    </div>
    <div class="msg" id="msg"></div>
  </form>
</div>

<!-- ============ RAPOR ÖNİZLEME / PDF ============ -->
<div class="btns noprint" id="reportButtons" style="display:none">
  <button type="button" class="sec" id="back">← Düzenlemeye Dön</button>
  <button type="button" id="printPdf">PDF Olarak Kaydet / Yazdır</button>
</div>
<div id="report"></div>

</main>

<script>
/* ------------------------------------------------------------------
   KONTROL MADDELERİ
   Separatör, şanzıman, yedek parça için bu listeyi değiştirmeniz yeterli.
------------------------------------------------------------------- */
const ITEMS = [
  { id: "sensor",   label: "Sıcaklık, titreşim sensörü ve devir sensörü kontrolü (kapalı dekantörde sadece devir sensörü)" },
  { id: "rulman",   label: "Rulman yataklarına gres basılma kontrolü" },
  { id: "civata",   label: "Civata tork kontrolü" },
  { id: "montaj",   label: "Montaj kontrolü" },
  { id: "etiket",   label: "Etiket kontrolü (motor etiketleri, uyarı etiketleri, model etiketi vb.)" },
  { id: "kayis",    label: "Kayış gerginlik ve kasnağa uygunluk kontrolü" },
  { id: "sut",      label: "Katı ve sıvı çıkış şut bağlantılarının kontrolü" },
  { id: "motorYon", label: "Motor dönüş yönü ve motor dönüş yönü etiketi kontrolü" },
  { id: "yaglama",  label: "Yağlama sistemi kontrolü" }
];

const RES = [
  { v: "ok",  t: "Uygun" },
  { v: "bad", t: "Uygunsuz" },
  { v: "na",  t: "Mevcut değil" }
];

const KEY = "kontrolRaporu:" + location.pathname;

/* Arka plan: silik dekantör görseli (sadece rapor üzerinde) */
const WM = `<div class="rwm" aria-hidden="true"><img src="dekanter.jpg" alt=""></div>`;
const photos = [];

/* ---------- yardımcılar ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const flash = (t) => { $("#msg").textContent = t; setTimeout(() => $("#msg").textContent = "", 2500); };

/* ---------- formu oluştur ---------- */
function buildItems() {
  $("#items").innerHTML = ITEMS.map((it, i) => `
    <div class="item">
      <div class="name">${i + 1}. ${esc(it.label)}</div>
      <div class="res">
        ${RES.map(r => `<label><input type="radio" name="i_${it.id}" value="${r.v}"> ${r.t}</label>`).join("")}
      </div>
      <textarea name="n_${it.id}" placeholder="Açıklama (isteğe bağlı)" style="min-height:44px"></textarea>
    </div>`).join("");
}

/* ---------- veri topla ---------- */
function collect() {
  const form = $("#form");
  const data = {};
  for (const [k, v] of new FormData(form).entries()) data[k] = v;
  data.onay = form.elements.onay.checked;
  return data;
}

/* ---------- taslak ---------- */
function saveDraft() {
  try {
    localStorage.setItem(KEY, JSON.stringify(collect()));
    flash("Taslak kaydedildi.");
  } catch (e) { flash("Taslak kaydedilemedi (tarayıcı izni)."); }
}

function loadDraft() {
  let d;
  try { d = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { d = null; }
  if (!d) return;
  const form = $("#form");
  for (const [k, v] of Object.entries(d)) {
    const el = form.elements[k];
    if (!el) continue;
    if (el instanceof RadioNodeList) { [...el].forEach(r => r.checked = (r.value === v)); }
    else if (el.type === "checkbox") el.checked = !!v;
    else el.value = v;
  }
  if (!d.onay) form.elements.onay.checked = false;
}

/* ---------- fotoğraflar ---------- */
$("#photoInput").addEventListener("change", async (e) => {
  for (const f of e.target.files) {
    const url = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
    photos.push(url);
  }
  e.target.value = "";
  renderPhotos();
});

function renderPhotos() {
  $("#photos").innerHTML = photos.map((src, i) => `
    <div>
      <img src="${src}" alt="Görsel ${i + 1}">
      <button type="button" class="sec noprint" data-rm="${i}" style="width:100%;padding:6px;margin-top:4px">Kaldır</button>
    </div>`).join("");
}

$("#photos").addEventListener("click", (e) => {
  const i = e.target.dataset.rm;
  if (i !== undefined) { photos.splice(+i, 1); renderPhotos(); }
});

/* ---------- rapor üret ---------- */
function renderReport() {
  const d = collect();
  const testAdi = d.test === "sulu" ? "Sulu" : "Kuru";
  const resHtml = (id) => {
    const v = d["i_" + id];
    if (v === "ok")  return '<span class="ok">UYGUN</span>';
    if (v === "bad") return '<span class="bad">UYGUNSUZ</span>';
    if (v === "na")  return '<span class="na">MEVCUT DEĞİL</span>';
    return "";
  };

  const rows = ITEMS.map((it, i) => `
    <tr>
      <td style="width:6%;text-align:center">${i + 1}</td>
      <td>${esc(it.label)}</td>
      <td style="width:18%;text-align:center">${resHtml(it.id)}</td>
      <td style="width:24%">${esc(d["n_" + it.id])}</td>
    </tr>`).join("");

  const gallery = photos.length
    ? `<div class="gallery">${photos.map((src, i) => `<div><div style="font-size:12px">${i + 1}</div><img src="${src}" alt=""></div>`).join("")}</div>`
    : "<div style='font-size:13px'>Görsel eklenmedi.</div>";

  $("#report").innerHTML = `${WM}
    <table>
      <tr>
        <td class="title" style="width:60%"><img class="logo" src="logo.png" alt="Centriplus">MAKİNE KONTROL RAPORU<br><span style="font-size:13px;font-weight:400">${esc(d.tip)} TEST KONTROL RAPORU</span></td>
        <td style="width:40%">
          <table><tr><th>Doküman No</th><td>${esc(d.docNo)}</td></tr>
          <tr><th>Revizyon No / Tarihi</th><td>${esc(d.rev)}</td></tr></table>
        </td>
      </tr>
    </table>

    <table style="margin-top:8px">
      <tr><th>Marka ve Model</th><td>${esc(d.marka)}</td><th>Müşteri</th><td>${esc(d.musteri)}</td></tr>
      <tr><th>Makine Tipi</th><td>${esc(d.tip)}</td><th>Servis No</th><td>${esc(d.servis)}</td></tr>
      <tr><th>Seri Numarası</th><td>${esc(d.seri)}</td><th>Sektör</th><td>${esc(d.sektor)}</td></tr>
      <tr><th>Test Adımı</th><td colspan="3">${testAdi} Test Kontrolü</td></tr>
    </table>

    <table style="margin-top:8px">
      <tr><th style="text-align:center">No</th><th>Kontrol Edilecek Unsurlar</th><th style="text-align:center">Kontrol Sonucu</th><th>Açıklama</th></tr>
      ${rows}
    </table>

    <table style="margin-top:8px">
      <tr><th>Sevk Kararı</th></tr>
      <tr><td style="min-height:60px">${d.onay ? "<b>Sevk işlemleri hakkında onay kararı verilmiştir.</b>" : "Onay verilmemiştir."}
        ${d.sevkNot ? "<br>" + esc(d.sevkNot).replace(/\n/g, "<br>") : ""}</td></tr>
    </table>

    <table style="margin-top:8px" class="sig">
      <tr><th>Testi Raporlayan</th><td>${esc(d.raporlayan)}</td></tr>
      <tr><th>Testi Onaylayan</th><td>${esc(d.onaylayan)}</td></tr>
      <tr><th>Tarih</th><td>${esc(d.tarih ? d.tarih.split("-").reverse().join(".") : "")}</td></tr>
    </table>

    <div style="margin-top:16px;font-weight:700;text-align:center">GÖRSELLER</div>
    <div style="margin-top:6px">${gallery}</div>
  `;

  $("#editor").style.display = "none";
  $("#reportButtons").style.display = "flex";
  $("#report").style.display = "block";
  window.scrollTo(0, 0);
}

/* ---------- olaylar ---------- */
$("#saveDraft").addEventListener("click", saveDraft);
$("#clearDraft").addEventListener("click", () => {
  try { localStorage.removeItem(KEY); } catch (e) {}
  location.reload();
});
$("#preview").addEventListener("click", renderReport);
$("#back").addEventListener("click", () => {
  $("#editor").style.display = "block";
  $("#reportButtons").style.display = "none";
  $("#report").style.display = "none";
  window.scrollTo(0, 0);
});
$("#printPdf").addEventListener("click", () => window.print());

/* ---------- başlat ---------- */
buildItems();
loadDraft();
renderPhotos();

/* Çevrimdışı çalışma için servis çalışanı (yalnızca https / ana ekran) */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
